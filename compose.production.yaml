services:
  api:
    environment:
      PLATFORM_AUTH_MODE: token
      PLATFORM_AUTH_SECRET: ${PLATFORM_AUTH_SECRET:?Set PLATFORM_AUTH_SECRET}
      PLATFORM_BOOTSTRAP_KEY: ${PLATFORM_BOOTSTRAP_KEY:?Set PLATFORM_BOOTSTRAP_KEY}
    restart: always

  worker:
    environment:
      PLATFORM_AUTH_MODE: token
      PLATFORM_AUTH_SECRET: ${PLATFORM_AUTH_SECRET:?Set PLATFORM_AUTH_SECRET}
      PLATFORM_BOOTSTRAP_KEY: ${PLATFORM_BOOTSTRAP_KEY:?Set PLATFORM_BOOTSTRAP_KEY}
    restart: always

  ui:
    environment:
      PLATFORM_AUTH_MODE: token
      PLATFORM_AUTH_SECRET: ${PLATFORM_AUTH_SECRET:?Set PLATFORM_AUTH_SECRET}
      PLATFORM_BOOTSTRAP_KEY: ${PLATFORM_BOOTSTRAP_KEY:?Set PLATFORM_BOOTSTRAP_KEY}
      PLATFORM_ACCESS_TOKEN: ${PLATFORM_ACCESS_TOKEN:?Set PLATFORM_ACCESS_TOKEN}
    restart: always
