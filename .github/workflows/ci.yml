name: quality-gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Compile Python sources
        run: python -m compileall -q app.py src tests

      - name: Check for high-confidence code errors
        run: ruff check .

      - name: Run deployment preflight
        run: python scripts/deployment_preflight.py --profile all

      - name: Run regression suite
        run: pytest

      - name: Build deployment image
        run: docker build -t green-electricity-platform:ci .
